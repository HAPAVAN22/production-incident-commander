global:
  scrape_interval: 30s

scrape_configs:
  - job_name: "incident-commander"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "payments-events-consumer"
    static_configs:
      - targets: ["payments-consumer:8001"]

  - job_name: "kafka-lag-monitor"
    static_configs:
      - targets: ["kafka-lag-monitor:8002"]